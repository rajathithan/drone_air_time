[project]
name = "drone-air-time"
version = "0.1.0"
description = "The Drone Flight time API is an autonomous flight scheduling system. It receives a location and date, fetches high-altitude weather telemetry, archives the data for safety audits, identifies the safest flight window, and reserves that time in the user's Google Calendar for Drone flight time window."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.28.1",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "toolbox-core>=1.0.0",
    "google-cloud-logging>=3.15.0",
]
